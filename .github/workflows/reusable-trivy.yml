name: Reusable Trivy

on: 
  workflow_call:

jobs:
  trivy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t secure-hr-api:ci ./app

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-hr-api:ci
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL